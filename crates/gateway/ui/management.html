<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quotio Usage</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d10; color: #e6e9ef;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .04em; }
  .sub { color: #6b7480; font-size: 12px; margin-bottom: 18px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  input, button { font: inherit; background: #151a21; color: #e6e9ef;
                  border: 1px solid #262d38; border-radius: 7px; padding: 7px 11px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: #1e2530; }
  button:disabled { opacity: .38; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
           gap: 10px; margin-bottom: 18px; }
  .card { background: #12161c; border: 1px solid #1e242d; border-radius: 10px; padding: 12px 14px; }
  .card .k { color: #6b7480; font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
  .card .v { font-size: 21px; margin-top: 5px; }
  .acct { background: #12161c; border: 1px solid #1e242d; border-radius: 10px;
          padding: 13px 15px; margin-bottom: 9px; }
  .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .id { font-weight: 600; }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 999px;
         border: 1px solid #2b3342; color: #96a0ae; }
  .ok { color: #4ade80; border-color: #1e4a32; }
  .bad { color: #f87171; border-color: #4a1e1e; }
  .right { margin-left: auto; display: flex; gap: 7px; align-items: center; }
  .win { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px;
         align-items: center; margin-top: 9px; }
  .lbl { color: #6b7480; font-size: 11px; }
  .track { height: 7px; background: #1b212a; border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; background: #4ade80; transition: width .3s; }
  .fill.mid { background: #fbbf24; }
  .fill.hi { background: #f87171; }
  .meta { color: #8b95a3; font-size: 11px; white-space: nowrap; }
  .none { color: #59616d; font-size: 11px; margin-top: 8px; font-style: italic; }
  .err { color: #f87171; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Quotio Usage</h1>
<div class="sub" id="sub">management surface</div>
<div class="err" id="err"></div>
<div class="bar">
  <input id="key" type="password" placeholder="API key" size="22" />
  <button id="save">connect</button>
  <button id="refresh">refresh quota</button>
  <button id="warm">warm all</button>
</div>
<div class="cards" id="cards"></div>
<div id="list"></div>
<script>
const $ = (id) => document.getElementById(id);
const KEY = "quotio.key";
let apiKey = localStorage.getItem(KEY) || "";
$("key").value = apiKey;

async function call(path, method) {
  const r = await fetch(path, {
    method: method || "GET",
    headers: { Authorization: "Bearer " + apiKey },
  });
  if (!r.ok) throw new Error(path + " -> HTTP " + r.status);
  return r.json();
}

function windowRow(label, w) {
  if (!w || w.used_percent === null || w.used_percent === undefined) return "";
  const pct = Math.max(0, Math.min(100, w.used_percent));
  const cls = pct >= 80 ? "hi" : pct >= 50 ? "mid" : "";
  const mins = w.window_minutes;
  const name = label || (mins === 10080 ? "weekly"
    : mins >= 1440 ? Math.round(mins / 1440) + "d"
    : mins ? Math.round(mins / 60) + "h" : "?");
  let resets = "";
  if (w.reset_after_seconds != null) {
    const s = w.reset_after_seconds;
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    resets = " · resets " + (d ? d + "d " + h + "h" : h ? h + "h " + m + "m" : m + "m");
  }
  return `<div class="win"><span class="lbl">${name}</span>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>
    <span class="meta">${pct.toFixed(0)}%${resets}</span></div>`;
}

function render(data) {
  const accts = data.accounts || [];
  const known = accts.filter((a) => a.usage && a.usage.observed_at_unix);
  const avg = known.length
    ? known.reduce((s, a) => s + ((a.usage.primary && a.usage.primary.used_percent) || 0), 0) / known.length
    : 0;
  $("cards").innerHTML = [
    ["accounts", accts.length],
    ["available", accts.filter((a) => a.health && a.health.status === "available").length],
    ["quota known", known.length + "/" + accts.length],
    ["avg primary", avg.toFixed(1) + "%"],
    ["served", data.served ?? 0],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  $("list").innerHTML = accts.map((a) => {
    const u = a.usage || {};
    const healthy = a.health && a.health.status === "available";
    const credits = u.reset_credits_available || 0;
    const rows = windowRow(null, u.primary) + windowRow(null, u.secondary);
    return `<div class="acct">
      <div class="head">
        <span class="id">${a.id}</span>
        <span class="tag ${healthy ? "ok" : "bad"}">${(a.health && a.health.status) || "?"}</span>
        <span class="tag">${a.provider}</span>
        ${u.plan_type ? `<span class="tag">${u.plan_type}</span>` : ""}
        <span class="right">
          <span class="meta">ok ${a.ok ?? 0} · fail ${a.fails ?? 0}</span>
          <button data-warm="${a.id}">warm</button>
          <button data-reset="${a.id}" ${credits ? "" : "disabled"}>reset 5h (${credits})</button>
        </span>
      </div>
      ${rows || `<div class="none">${a.provider} exposes no quota API</div>`}
    </div>`;
  }).join("");
}

async function load() {
  if (!apiKey) { $("sub").textContent = "enter an API key to connect"; return; }
  try {
    render(await call("/admin/usage"));
    $("err").textContent = "";
    $("sub").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("err").textContent = String(e.message || e);
  }
}

$("save").onclick = () => {
  apiKey = $("key").value.trim();
  localStorage.setItem(KEY, apiKey);
  load();
};
$("refresh").onclick = async () => { await call("/admin/usage/refresh", "POST"); load(); };
$("warm").onclick = async () => { await call("/admin/warmup", "POST"); load(); };
document.addEventListener("click", async (ev) => {
  const w = ev.target.getAttribute && ev.target.getAttribute("data-warm");
  const r = ev.target.getAttribute && ev.target.getAttribute("data-reset");
  if (w) { await call("/admin/accounts/" + encodeURIComponent(w) + "/warmup", "POST"); load(); }
  if (r && confirm("Spend one manual 5h reset credit on " + r + "?")) {
    await call("/admin/accounts/" + encodeURIComponent(r) + "/reset", "POST");
    load();
  }
});
load();
setInterval(load, 15000);
</script>
</body>
</html>
