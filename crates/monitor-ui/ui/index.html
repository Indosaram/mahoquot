<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quotio Monitor</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --dim: #8b94a7;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 20px;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .url { color: var(--dim); font-size: 12px; }
  .status { margin-left: auto; font-size: 12px; color: var(--dim); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .card .value { font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { padding: 2px 8px; border-radius: 99px; font-size: 11px; border: 1px solid; }
  .pill.available { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .pill.cooldown  { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pill.authfailed, .pill.unknown { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .prov { color: var(--dim); font-size: 11px; }
  .err { color: var(--bad); font-size: 11px; }
  .rate-bad { color: var(--bad); }
  .rate-warn { color: var(--warn); }
  .banner { background: color-mix(in srgb, var(--bad) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
            color: var(--bad); padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Quotio Monitor</h1>
  <span class="url" id="url"></span>
  <span class="status" id="status">connecting…</span>
</header>
<div id="banner"></div>
<div class="cards" id="cards"></div>
<table>
  <thead><tr>
    <th>Account</th><th>Status</th>
    <th class="num">OK</th><th class="num">Fails</th><th class="num">Fail&nbsp;%</th>
    <th class="num">p50&nbsp;ms</th><th class="num">p99&nbsp;ms</th><th>Last error</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>

<script type="module">
const invoke = window.__TAURI__.core.invoke;
const $ = (id) => document.getElementById(id);
const num = (v, d = 0) => Number(v ?? 0).toFixed(d);

invoke("gateway_url").then((u) => { $("url").textContent = u; });

function card(label, value) {
  return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

function rateClass(r) {
  if (r >= 0.5) return "rate-bad";
  if (r > 0) return "rate-warn";
  return "";
}

function render(v) {
  $("cards").innerHTML = [
    card("Served", v.served),
    card("In flight", v.in_flight),
    card("Failed over", v.failed_over),
    card("Failover %", num(v.failover_rate * 100, 1) + "%"),
    card("Refreshed", v.refreshed),
    card("p50 ms", num(v.p50_ms, 1)),
    card("p99 ms", num(v.p99_ms, 1)),
    card("Uptime s", v.uptime_secs),
  ].join("");

  $("banner").innerHTML = v.degraded.length
    ? `<div class="banner">degraded: ${v.degraded.join(", ")}</div>`
    : "";

  $("rows").innerHTML = v.accounts.map((a) => {
    const cd = a.cooldown_remaining_secs != null && a.cooldown_remaining_secs > 0
      ? ` <span class="prov">${a.cooldown_remaining_secs}s</span>` : "";
    return `<tr>
      <td>${a.id}<div class="prov">${a.provider}</div></td>
      <td><span class="pill ${a.status.replace(/[^a-z]/gi, "").toLowerCase()}">${a.status}</span>${cd}</td>
      <td class="num">${a.ok}</td>
      <td class="num">${a.fails}</td>
      <td class="num ${rateClass(a.failure_rate)}">${num(a.failure_rate * 100, 1)}%</td>
      <td class="num">${a.samples ? num(a.p50_ms, 1) : "–"}</td>
      <td class="num">${a.samples ? num(a.p99_ms, 1) : "–"}</td>
      <td class="err">${a.last_error ?? ""}</td>
    </tr>`;
  }).join("");
}

async function tick() {
  try {
    render(await invoke("load_stats"));
    $("status").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("status").textContent = "error: " + e;
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
