<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quotio Monitor</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #141417;
    --panel-2: #1b1b1f;
    --line: #26262c;
    --line-soft: #1f1f24;
    --fg: #ececf1;
    --fg-dim: #a1a1aa;
    --fg-faint: #6b6b76;
    --accent: #f0801a;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --radius: 12px;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f6f6f7; --panel: #fff; --panel-2: #fafafa; --line: #e3e3e7;
    --line-soft: #ededf0; --fg: #18181b; --fg-dim: #52525b; --fg-faint: #8a8a94;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--sans); font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: grid; grid-template-columns: 208px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand {
    padding: 16px 16px 12px; font-weight: 650; font-size: 14px;
    letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; flex: 1; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--fg-dim); font: inherit; text-align: left;
    transition: background .12s, color .12s;
  }
  .nav button:hover { background: var(--panel-2); color: var(--fg); }
  .nav button[aria-current="page"] { background: var(--accent); color: #fff; font-weight: 550; }
  .nav svg { width: 15px; height: 15px; flex: none; }

  .proxybar {
    margin: 8px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel-2);
  }
  .proxybar .row { display: flex; align-items: center; gap: 8px; }
  .proxybar .label { font-size: 11px; color: var(--fg-faint); }
  .proxybar .val { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }

  /* ---------- main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
  .spacer { flex: 1; }
  .search {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 6px 10px; font: inherit; width: 200px;
  }
  .search::placeholder { color: var(--fg-faint); }
  .btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit;
    transition: background .12s, border-color .12s;
  }
  .btn:hover:not(:disabled) { background: var(--panel-2); border-color: #34343c; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.icon { padding: 6px 8px; line-height: 0; }
  .btn svg { width: 14px; height: 14px; }

  .tabs {
    display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel);
    cursor: pointer; color: var(--fg-dim); font: inherit; white-space: nowrap;
    transition: border-color .12s, color .12s, background .12s;
  }
  .tab:hover { color: var(--fg); background: var(--panel-2); }
  .tab[aria-selected="true"] { border-color: var(--accent); color: var(--fg); background: var(--panel-2); }
  .tab .glyph { width: 18px; height: 18px; display: grid; place-items: center; flex: none; }
  .tab .count {
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
    background: var(--line); color: var(--fg); font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
  }
  .tab[aria-selected="true"] .count { background: var(--accent); color: #fff; }
  .tab .health { width: 7px; height: 7px; border-radius: 50%; }

  .scroll { overflow-y: auto; padding: 16px 20px 28px; flex: 1; }

  /* Compact strip: the reference gives this area no vertical budget, so
     summary metrics stay on one line instead of six cards. */
  .cards { display: flex; flex-wrap: wrap; gap: 18px; padding: 8px 2px 14px; margin-bottom: 6px;
           border-bottom: 1px solid var(--line-soft); }
  .card { display: flex; align-items: baseline; gap: 6px; }
  .card .k { font-size: 11px; color: var(--fg-faint); }
  .card .v { font-size: 13px; font-weight: 620; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

  .acct { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  .acct-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
  .email { font-weight: 560; letter-spacing: -0.01em; }
  .pill {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--fg-dim); text-transform: uppercase; letter-spacing: .04em;
  }
  .pill.plan { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 700; }
  .pill.ok { color: var(--ok); border-color: rgba(63,185,80,.35); }
  .pill.warn { color: var(--warn); border-color: rgba(210,153,34,.35); }
  .pill.bad { color: var(--bad); border-color: rgba(248,81,73,.35); }
  .stats { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }

  .groups { padding: 0 14px 12px; }
  .grp + .grp { margin-top: 9px; border-top: 1px solid var(--line-soft); padding-top: 9px; }
  .grp-name { font-size: 11.5px; color: var(--fg); font-weight: 620; margin-bottom: 6px;
              display: flex; align-items: center; gap: 6px; }
  .grp-name .models { font-weight: 400; color: var(--fg-faint); font-size: 10.5px; }
  .grp-name svg { width: 13px; height: 13px; flex: none; }
  .qrow { margin-top: 6px; }
  .qtop { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .qname { font-size: 12px; color: var(--fg-dim); flex: 1; display: flex; align-items: center; gap: 6px; }
  .qleft { font-size: 12px; font-weight: 620; font-variant-numeric: tabular-nums; }
  .clock {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px;
    color: var(--fg-dim); background: var(--panel-2); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 20px; font-variant-numeric: tabular-nums;
  }
  .clock svg { width: 10px; height: 10px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; transition: width .3s ease; }

  .empty { color: var(--fg-faint); text-align: center; padding: 40px 0; }
  .banner {
    background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3);
    color: #ffb4ae; border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; font-size: 12px;
  }
  .note { font-size: 11px; color: var(--fg-faint); padding: 6px 14px 12px; }
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span> Quotio</div>
    <nav class="nav" id="nav"></nav>
    <div class="proxybar">
      <div class="row">
        <span class="health" id="proxyDot" style="width:8px;height:8px;border-radius:50%;background:var(--fg-faint)"></span>
        <div>
          <div class="label">Local Proxy</div>
          <div class="val" id="proxyVal">-</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="title">Quota</h1>
      <span class="spacer"></span>
      <input class="search" id="search" placeholder="Search accounts..." />
      <button type="button" class="btn" id="warmAll">Warm all</button>
      <button type="button" class="btn icon" id="refresh" title="Refresh quota" aria-label="Refresh quota">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" role="img">
          <title>Refresh</title><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="scroll">
      <div id="banner"></div>
      <div class="cards" id="cards"></div>
      <div id="list"></div>
    </div>
  </main>
</div>

<script>
const BASE = localStorage.getItem("quotio.base") || "http://127.0.0.1:18871";
const KEY  = localStorage.getItem("quotio.key")  || "qkey";

const ICONS = {
  antigravity: '<svg viewBox="0 0 24 24" fill="none" stroke="#4b8bf5" stroke-width="2"><path d="M12 3 3 20h18L12 3z"/></svg>',
  codex:       '<svg viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>',
  other:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
};
const NAV = [
  ["quota", "Quota", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'],
  ["accounts", "Accounts", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6"/></svg>'],
  ["logs", "Logs", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h9l5 5v13H5z"/><path d="M8 13h8M8 17h5"/></svg>'],
];

let view = "quota", tab = "all", query = "", data = null;

const clockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function maskEmail(s) {
  if (!s) return "unknown";
  const at = s.indexOf("@");
  if (at < 1) return s;
  const user = s.slice(0, at), dom = s.slice(at + 1);
  const dot = dom.lastIndexOf(".");
  const name = dot > 0 ? dom.slice(0, dot) : dom;
  const tld = dot > 0 ? dom.slice(dot) : "";
  return "*".repeat(Math.min(user.length, 8)) + "@" + "*".repeat(Math.min(name.length, 5)) + tld;
}
function fmtLeft(sec) {
  if (sec == null) return null;
  if (sec <= 0) return "now";
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}
function barColor(leftPct) {
  if (leftPct <= 10) return "var(--bad)";
  if (leftPct <= 35) return "var(--warn)";
  return "var(--ok)";
}
function healthClass(h) {
  const s = String(h || "").toLowerCase();
  if (s.includes("available") || s.includes("healthy") || s.includes("ok")) return "ok";
  if (s.includes("cooldown") || s.includes("degraded")) return "warn";
  return "bad";
}

async function api(path, method = "GET") {
  const r = await fetch(BASE + path, { method, headers: { Authorization: "Bearer " + KEY } });
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

function windowLabel(b) {
  if (b.display_name) return b.display_name.replace(/ Remaining$/, "");
  const w = b.window || "";
  if (w === "5h") return "5 hour";
  if (w === "weekly") return "Weekly";
  return w || "Window";
}

/** Rows for one account: real model groups when present, else the flat windows. */
function quotaRows(u) {
  const now = Date.now() / 1000;
  const groups = (u && u.groups) || [];
  if (groups.length) {
    return groups.map(g => ({
      name: g.display_name || "Models",
      // Upstream sends "Models within this group: A, B"; keep only the list.
      models: (g.models || "").replace(/^[^:]*:\s*/, ""),
      rows: (g.buckets || []).map(b => ({
        label: windowLabel(b),
        leftPct: b.used_percent == null ? null : 100 - b.used_percent,
        resetIn: b.reset_at_unix ? b.reset_at_unix - now : null,
      })),
    }));
  }
  const flat = [];
  for (const [key, w] of [["primary", u && u.primary], ["secondary", u && u.secondary]]) {
    if (!w || w.used_percent == null) continue;
    const mins = w.window_minutes;
    flat.push({
      label: mins ? (mins >= 10080 ? "Weekly" : mins >= 1440 ? Math.round(mins / 1440) + "d" : Math.round(mins / 60) + "h") : key,
      leftPct: 100 - w.used_percent,
      resetIn: w.reset_at_unix ? w.reset_at_unix - now : (w.reset_after_seconds ?? null),
    });
  }
  return flat.length ? [{ name: "Usage", models: "", rows: flat }] : [];
}

function render() {
  document.getElementById("nav").innerHTML = NAV.map(([id, label, svg]) =>
    `<button type="button" data-view="${id}" ${view === id ? 'aria-current="page"' : ""}>${svg}<span>${label}</span></button>`
  ).join("");
  document.getElementById("nav").onclick = e => {
    const b = e.target.closest("button[data-view]");
    if (b) { view = b.dataset.view; render(); }
  };
  document.getElementById("title").textContent = NAV.find(n => n[0] === view)[1];

  if (!data) return;
  const accounts = data.accounts || [];

  const byProv = {};
  for (const a of accounts) {
    if (!byProv[a.provider]) byProv[a.provider] = [];
    byProv[a.provider].push(a);
  }
  const provs = Object.keys(byProv).sort();
  document.getElementById("tabs").innerHTML =
    [`<button type="button" class="tab" data-tab="all" aria-selected="${tab === "all"}">
        <span class="glyph">${ICONS.other}</span><span>All</span>
        <span class="count">${accounts.length}</span></button>`]
    .concat(provs.map(p => {
      const list = byProv[p];
      const bad = list.filter(a => healthClass(a.health) !== "ok").length;
      const color = bad === 0 ? "var(--ok)" : bad === list.length ? "var(--bad)" : "var(--warn)";
      return `<button type="button" class="tab" data-tab="${p}" aria-selected="${tab === p}">
        <span class="glyph">${ICONS[p] || ICONS.other}</span>
        <span>${p[0].toUpperCase() + p.slice(1)}</span>
        <span class="count">${list.length}</span>
        <span class="health" style="background:${color}"></span></button>`;
    })).join("");
  document.getElementById("tabs").onclick = e => {
    const b = e.target.closest("button[data-tab]");
    if (b) { tab = b.dataset.tab; render(); }
  };

  const withQuota = accounts.filter(a => quotaRows(a.usage).length).length;
  document.getElementById("cards").innerHTML = [
    ["Accounts", accounts.length],
    ["Quota known", `${withQuota}/${accounts.length}`],
    ["Served", data.served ?? 0],
    ["Failover", data.failed_over ?? 0],
    ["In flight", data.in_flight ?? 0],
    ["Uptime", Math.floor((data.uptime_secs ?? 0) / 60) + "m"],
  ].map(([k, v]) => `<div class="card"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

  const q = query.trim().toLowerCase();
  const shown = accounts.filter(a =>
    (tab === "all" || a.provider === tab) && (!q || a.id.toLowerCase().includes(q))
  );

  const degraded = accounts.filter(a => healthClass(a.health) === "bad").length;
  document.getElementById("banner").innerHTML = degraded
    ? `<div class="banner">${degraded} account${degraded > 1 ? "s" : ""} unavailable.</div>` : "";

  document.getElementById("list").innerHTML = shown.length ? shown.map(a => {
    const groups = quotaRows(a.usage);
    const u = a.usage || {};
    const hc = healthClass(a.health);
    const head = `<div class="acct-head">
        <span class="email">${maskEmail(a.id)}</span>
        ${u.plan_type ? `<span class="pill plan">${u.plan_type}</span>` : ""}
        ${hc === "ok" ? "" : `<span class="pill ${hc}">${String(a.health || "?").replace(/[{}"]/g, "").slice(0, 18)}</span>`}
        <span class="spacer"></span>
        <span class="stats">ok ${a.ok ?? 0} · fail ${a.fails ?? 0}${a.ttft ? " · p50 " + Math.round(a.ttft) + "ms" : ""}</span>
        <button type="button" class="btn" data-warm="${encodeURIComponent(a.id)}">Warm</button>
        <button type="button" class="btn icon" data-refresh="${encodeURIComponent(a.id)}" title="Refresh this account" aria-label="Refresh this account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" role="img">
            <title>Refresh account</title><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>`;
    const body = groups.length ? `<div class="groups">${groups.map(g => `
        <div class="grp">
          <div class="grp-name">${ICONS[a.provider] || ICONS.other}${g.name}${g.models ? `<span class="models">· ${g.models}</span>` : ""}</div>
          ${g.rows.map(r => {
            const left = r.leftPct == null ? null : Math.max(0, Math.min(100, r.leftPct));
            const c = left == null ? "var(--fg-faint)" : barColor(left);
            const t = fmtLeft(r.resetIn);
            return `<div class="qrow">
              <div class="qtop">
                <span class="qname">${r.label}</span>
                <span class="qleft" style="color:${c}">${left == null ? "-" : left.toFixed(left < 10 ? 1 : 0) + "% left"}</span>
                ${t ? `<span class="clock">${clockSvg}${t}</span>` : ""}
              </div>
              <div class="bar"><i style="width:${left ?? 0}%;background:${c}"></i></div>
            </div>`;
          }).join("")}
        </div>`).join("")}</div>`
      : `<div class="note">No quota reported for this account.</div>`;
    return `<div class="acct">${head}${body}</div>`;
  }).join("") : `<div class="empty">No accounts match "${query}".</div>`;

  document.getElementById("list").onclick = async e => {
    const w = e.target.closest("button[data-warm]");
    if (w) {
      w.disabled = true; w.textContent = "...";
      try { await api("/admin/warmup/" + w.dataset.warm, "POST"); await load(); }
      catch { w.textContent = "Warm"; w.disabled = false; }
      return;
    }
    const r = e.target.closest("button[data-refresh]");
    if (r) {
      r.disabled = true;
      try { await api("/admin/usage/refresh", "POST"); await load(); }
      finally { r.disabled = false; }
    }
  };

  const up = data.uptime_secs != null;
  document.getElementById("proxyDot").style.background = up ? "var(--ok)" : "var(--bad)";
  document.getElementById("proxyVal").textContent = BASE.replace(/^https?:\/\//, "") + (up ? " · Running" : " · Down");
}

async function load() {
  try { data = await api("/admin/usage"); }
  catch (e) { document.getElementById("banner").innerHTML = `<div class="banner">${e.message}</div>`; }
  render();
}

document.getElementById("search").oninput = e => { query = e.target.value; render(); };
document.getElementById("warmAll").onclick = async ev => {
  ev.target.disabled = true; try { await api("/admin/warmup", "POST"); await load(); } finally { ev.target.disabled = false; }
};
document.getElementById("refresh").onclick = async ev => {
  ev.currentTarget.disabled = true;
  try { await api("/admin/usage/refresh", "POST"); await load(); } finally { ev.currentTarget.disabled = false; }
};

render();
load();
setInterval(load, 5000);
</script>
</body>
</html>
