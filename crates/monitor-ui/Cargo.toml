[package]
name = "mahoquot-monitor-ui"
version = "0.1.0"
edition = "2021"

# The executable carries the product name so macOS shows "mahoquot" in the
# menu bar and Dock for unbundled (cargo) launches.
[[bin]]
name = "mahoquot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
axum = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]

# objc 0.2.7 (terminal release) expands `cfg(feature = "cargo-clippy")` inside
# its msg_send! macro; declare the value so unexpected_cfgs stays a real signal.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# Global NSEvent monitors take an Objective-C block; the notch needs one to see
# the cursor while another app is frontmost.
block = "0.1"
