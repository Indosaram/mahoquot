name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MAHOQUOT_PROXY_DIR: ${{ github.workspace }}/mahoquot-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Indosaram/mahoquot-proxy
          ref: ${{ github.ref_name }}
          path: mahoquot-proxy
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Require signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Test and build gateway sidecar
        working-directory: mahoquot-proxy
        run: cargo test --workspace && cargo build --release --bin mahoquot-gateway --target ${{ matrix.target }}
      - name: Stage gateway sidecar
        shell: bash
        run: |
          mkdir -p gateways
          source="mahoquot-proxy/target/${{ matrix.target }}/release/mahoquot-gateway"
          destination="gateways/mahoquot-gateway-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then source="${source}.exe"; destination="${destination}.exe"; fi
          cp "$source" "$destination"
      - name: Build authored frontend
        working-directory: crates/monitor-ui/frontend
        run: bun install --frozen-lockfile && bun run test && bun run typecheck && bun run build
      - name: Build signed updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun install --frozen-lockfile && bun run tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mahoquot-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  publish-updater:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify signed artifacts and generate updater manifest
        run: |
          node scripts/generate-updater-manifest.mjs artifacts crates/monitor-ui/tauri.conf.json "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*
            release/*
