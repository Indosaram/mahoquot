name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Indosaram/mahoquot-proxy
          ref: ${{ github.ref_name }}
          path: mahoquot-proxy
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Require signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Test and build gateway sidecar
        working-directory: mahoquot-proxy
        run: cargo test --workspace && cargo build --release --bin mahoquot-gateway --target ${{ matrix.target }}
      - name: Stage gateway sidecar
        shell: bash
        run: |
          mkdir -p gateways
          source="mahoquot-proxy/target/${{ matrix.target }}/release/mahoquot-gateway"
          destination="gateways/mahoquot-gateway-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then source="${source}.exe"; destination="${destination}.exe"; fi
          cp "$source" "$destination"
      - name: Build authored frontend
        working-directory: crates/monitor-ui/frontend
        run: bun install --frozen-lockfile && bun run test && bun run typecheck && bun run build
      - name: Build signed updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun install --frozen-lockfile && bun run tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mahoquot-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  publish-updater:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Require all target artifacts
        run: |
          test -d artifacts/mahoquot-aarch64-apple-darwin
          test -d artifacts/mahoquot-x86_64-apple-darwin
          test -d artifacts/mahoquot-x86_64-pc-windows-msvc
          test -d artifacts/mahoquot-x86_64-unknown-linux-gnu
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
