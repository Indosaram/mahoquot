name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: crates/monitor-ui/frontend
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: crates/monitor-ui/frontend
        run: bun run typecheck

      - name: Lint frontend
        working-directory: crates/monitor-ui/frontend
        run: bun run lint

      - name: Test frontend
        working-directory: crates/monitor-ui/frontend
        run: bun run test

  desktop-browser:
    runs-on: ubuntu-latest
    env:
      MAHOQUOT_E2E_PORT: "18847"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: crates/monitor-ui/frontend
        run: bun install --frozen-lockfile
      - working-directory: crates/monitor-ui/frontend
        run: bunx playwright install --with-deps chromium
      - working-directory: crates/monitor-ui/frontend
        run: bun run build
      - working-directory: crates/monitor-ui/frontend
        run: bun run test:artifact
      - working-directory: crates/monitor-ui/frontend
        run: bun run test:e2e

  site-browser:
    runs-on: ubuntu-latest
    env:
      MAHOQUOT_SITE_QA_PORT: "18848"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: site
        run: bun install --frozen-lockfile
      - working-directory: crates/monitor-ui/frontend
        run: bun install --frozen-lockfile
      - name: Site component regressions
        working-directory: site
        run: node ../crates/monitor-ui/frontend/node_modules/vitest/vitest.mjs run --config e2e/site-unit.config.ts
      - working-directory: site
        run: bunx playwright install --with-deps chromium
      - working-directory: site
        run: bun run build
      - working-directory: site
        run: bunx --no-install playwright test e2e/spatial.spec.ts --project=chromium --workers=1

  script-contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision signature verifier
        run: brew install minisign
      - working-directory: crates/monitor-ui/frontend
        run: bun install --frozen-lockfile
      - working-directory: site
        run: bun install --frozen-lockfile
      - name: Script contracts (not runtime certification)
        run: bash scripts/verify.sh --scripts
